name: CI

on:
  pull_request:
  push:
    branches: ['**']

# Pull requests cancel stale runs. Pushes never do, so a release is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tests:
    runs-on: ubuntu-latest
    # Same ports and credentials as the dev stack (compose.yaml), which phpunit.xml and .env.example point at.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: fatwarag
          POSTGRES_PASSWORD: fatwarag
          POSTGRES_DB: fatwarag_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U fatwarag -d fatwarag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 63799:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, redis, pcntl
          coverage: none
      # Before composer install: package discovery boots the app, and the config reads addresses from the environment.
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test

  # Every push publishes an image tagged sha-<commit> and the branch name; main also gets latest.
  # Pull requests only prove the image builds.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Production release: only from main, only when the tests and the image are green.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, image]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the stack to the server
        run: scp -i ~/.ssh/deploy compose.prod.yaml deploy/deploy.sh "deploy@${DEPLOY_HOST}:/srv/fatwarag/"
      - name: Release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy "deploy@${DEPLOY_HOST}" "docker login ghcr.io -u '${GHCR_USER}' --password-stdin" <<< "$GHCR_TOKEN"
          ssh -i ~/.ssh/deploy "deploy@${DEPLOY_HOST}" "bash /srv/fatwarag/deploy.sh ${TAG}"
      - name: Log the server out of the registry
        if: always()
        run: ssh -i ~/.ssh/deploy "deploy@${DEPLOY_HOST}" "docker logout ghcr.io" || true
